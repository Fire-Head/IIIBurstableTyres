[MAIN]
;Version
;{
;    auto,
;    GTA_3_1_0,
;    GTA_3_1_1,
;    GTA_3_Steam
;}
Version=auto

; Sfx IDs.
nPoppedTireCollisionSfxID=371
nTireBlownSfxID=369
nFlatTyreSfxID=370

; Enables the random chance of tyres burst when a player's vehicle gets hit by peds gunfire.
; See [CHANCETABLE] section, to configure the values for each weapon type.
bUseRandomBurstForPeds=True

; List of vehicle model IDs that are immune to tyre burst.
; example1 - BannedVehicles=122,119,90,131
; example2 - BannedVehicles=
BannedVehicles=122

; Every time a player's vehicle gets hit by peds gunfire, the game generates a random number between 0 and 127.
; If a value from this table is greater than that random number - the nearest tyre will burst.
; Basically, the higher the value - the greater the chance of a tyre bursting.
; Set 0 for 0%, 128 for 100% or any value in between.
[CHANCETABLE]
COLT45=10
UZI=15
SHOTGUN=25
AK47=15
M16=15